  return topbar(true) + '<section class="debrief">' +
    '<header class="stack-sm"><p class="eyebrow">Debrief</p><h1>What happened to our Sparta?</h1></header>' +
    '<div class="metrics big">' + metric(peak + ' → ' + now.citizens, 'full citizens, peak to finish') + metric(now.inferiors, 'inferiors') + metric(pct(now.women), 'land held by women') + metric(pct(now.topTwo), 'land held by the top two households') + metric(state.perioikoi, 'iron bars paid to the perioikoi') + '</div>' +
    '<div class="result"><p class="eyebrow">Our Sparta and the real one</p><p>' + esc(summaryLine()) + '</p><p>Real Sparta: about 8,000 men in 480 BC (Herodotus 7.234); only 700 Spartiates fought at Leuctra in 371 BC (Xenophon, <cite>Hellenica</cite> 6.4.15); fewer than 1,000 in Aristotle\'s day (<cite>Politics</cite> 1270a).</p></div>' +
    '<div class="charts"><figure class="figure"><h3>Citizens, census by census</h3>' + citizenChart() + '</figure><figure class="figure"><h3>Who owns the land now</h3>' + landChart(active()) + '<div class="legend"><span><span class="swatch his"></span>Men\'s land</span><span><span class="swatch her"></span>Women\'s land</span></div></figure></div>' +
    '<div class="figure"><h3>Women\'s share of the land</h3>' + womenMeter(now.women) + '</div>' +
    '<section><h2>Big questions</h2><ol class="bigq">' + BIG_QUESTIONS.map(q => '<li>' + esc(q) + '</li>').join('') + '</ol></section>' +
    '<section><h2>Sources we chose to follow</h2>' + (state.sources.length ? '<ul class="plain-list">' + state.sources.map(s => '<li>Round ' + s.round + ', ' + esc(s.house) + ' (card ' + s.num + '): ' + esc(s.choice) + '</li>').join('') + '</ul>' : '<p class="muted">No source-choice cards (6 and 16) came up this game.</p>') + '</section>' +
    '<section><h2>Honours and tombstones</h2>' + (honours.length ? '<ul class="plain-list">' + honours.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<p class="muted">No named tombstones or Olympic victories this game.</p>') + '</section>' +
    '<section><h2>Cards and discussion</h2><div class="table-wrap"><table><thead><tr><th>Round</th><th>Household</th><th>Card</th><th>What happened</th><th>Discussion question and answer</th></tr></thead><tbody>' +
      answered.map(p => '<tr><td class="num">' + p.round + '</td><td>' + esc(p.house) + '</td><td>' + (p.num ? p.num + '. ' : '') + esc(p.title) + (p.choice ? '<br><span class="muted">' + esc(p.choice) + '</span>' : '') + '</td><td>' + esc(p.outcome) + '</td><td>' + esc(p.q) + (p.answer ? '<br><strong>' + esc(p.answer) + '</strong>' : '') + '</td></tr>').join('') +
    '</tbody></table></div></section>' +
    '<p class="credit">Based on <cite>Kleros Simulation</cite> by Alex Krause (St Philip\'s Christian College). Online adaptation by Cheryl Cutter.</p>' +
    '<div class="row no-print"><button class="btn primary" data-act="copy" data-primary>Copy the debrief</button>' + (canPrint() ? '<button class="btn" data-act="print">Print or save as PDF</button>' : '') + '<button class="btn quiet" data-act="restart">New game</button></div>' +
    (ui.copyFallback ? '<div class="stack-sm no-print"><label for="copy-fallback">Debrief text (select it all and copy)</label><textarea id="copy-fallback" rows="10" readonly>' + esc(ui.copyFallback) + '</textarea></div>' : '') +
  '</section>';
}
function debriefText(){
  const now = censusNow(), first = state.census[0] || now, out = [];
  out.push('KLEROS: A SPARTAN LIFE. DEBRIEF', '');
  out.push(summaryLine());
  out.push('Land held by women: ' + pct(now.women) + ' (Aristotle: nearly two-fifths, Politics 1270a).');
  out.push('Land held by the top two households: ' + pct(now.topTwo) + '.');
  out.push('Iron bars paid to the perioikoi: ' + state.perioikoi + '.', '');
  out.push('CENSUS');
  state.census.forEach(c => out.push('- ' + c.label + ': ' + c.citizens + ' citizens, ' + c.inferiors + ' inferiors, women hold ' + pct(c.women) + ' of the land'));
  out.push('', 'BIG QUESTIONS');
  BIG_QUESTIONS.forEach((q, i) => out.push((i + 1) + '. ' + q));
  out.push('', 'SOURCES WE CHOSE TO FOLLOW');
  if (state.sources.length) state.sources.forEach(s => out.push('- Round ' + s.round + ', ' + s.house + ' (card ' + s.num + '): ' + s.choice)); else out.push('- None came up.');
  out.push('', 'CARDS AND DISCUSSION');
  state.played.forEach(p => { out.push('- Round ' + p.round + ', ' + p.house + ', card ' + p.num + ' (' + p.title + '): ' + p.outcome); out.push('  Question: ' + p.q); if (p.answer) out.push('  Answer: ' + p.answer); });
  out.push('', 'Based on Kleros Simulation by Alex Krause (St Philip\'s Christian College). Online adaptation by Cheryl Cutter.');
  return out.join('\n');
}

/* ---------- overlays ---------- */
const SHORTCUTS = [['N or Enter','Next step, draw a card or continue'],['1 to 4','Choose an option on a card'],['R','Roll the die'],['D','Pause for discussion'],['H','Show or hide the historian\'s note'],['U','Undo the last action'],['T','Teacher panel'],['?','This help'],['Esc','Close a panel']];
function viewHelp(){
  return '<div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="help-title" tabindex="-1">' +
    '<div class="row between"><h2 id="help-title">How to run this lesson</h2><button type="button" class="btn small quiet" data-act="close" data-autofocus>Close <kbd>Esc</kbd></button></div>' +
    '<ol>' +
      '<li><strong>Before class:</strong> open this file in Chrome and connect to the projector. Teacher → Full screen makes it fill the screen.</li>' +
      '<li><strong>New game:</strong> enter how many students are here. Each student runs one household and the game runs the rest as neighbours. With more than 8 students, two or three share a household.</li>' +
      '<li><strong>Households and children:</strong> each student renames their household if they like, rolls for children and decides whether each child is a son or a daughter. Ask them why.</li>' +
      '<li><strong>Each round has five steps:</strong> Harvest → Mess Day → Cards → Neighbours → Census.</li>' +
      '<li><strong>On each card</strong> the household chooses and the game does the maths. Pause for discussion on one or two cards a round. Keep the historian\'s note hidden until students have had a go.</li>' +
      '<li><strong>Debrief:</strong> after the last round, the debrief sums up the game. Copy it into a document, or print it when the file is open in Chrome.</li>' +
    '</ol>' +
    '<p><strong>Timing for 2–4 students:</strong> about 3 minutes to set up, about 13 minutes a round, and 5 minutes for the debrief.</p>' +
    '<p><strong>Saving:</strong> the game saves itself on this laptop after every step. Close the lid and choose "Continue saved game" next lesson. Undo fixes a mis-click.</p>' +
    '<h3>The rules in brief</h3><ul>' +
      '<li>Every household starts with ' + START_PLOTS + ' plots of land and ' + START_BARS + ' iron bars. Each plot yields 1 iron bar at harvest.</li>' +
      '<li>Mess Day costs ' + DUES + ' iron bars for each citizen man. Sons count from two rounds after they are born.</li>' +
      '<li>A household that cannot pay either gives land to the richest household (' + GIFT_PRICE + ' iron bars a plot) or lets members lose full citizenship. Inferiors keep their land but no longer count as citizens.</li>' +
      '<li>When a head dies, each son gets one share of his land and each daughter half a share. The eldest son takes over. With no son, a daughter becomes an heiress and the kings choose her husband. With no children, the household adopts a son. If no household has a spare son, the line ends and its land goes to the richest household. The student then takes over the poorest neighbour.</li>' +
      '<li>Cards that do not suit a household (for example, a gift for a wife when there is no wife) are skipped automatically.</li>' +
    '</ul>' +
    '<h3>Keyboard shortcuts</h3><div class="table-wrap"><table><tbody>' + SHORTCUTS.map(s => '<tr><th scope="row">' + s[0] + '</th><td>' + s[1] + '</td></tr>').join('') + '</tbody></table></div>' +
    '<p class="credit">Based on <cite>Kleros Simulation</cite> by Alex Krause (St Philip\'s Christian College). Online adaptation by Cheryl Cutter.</p>' +
  '</div>';
}
function houseEditor(h){
  const opts = state.houses.map(x => '<option value="' + x.id + '"' + (x.id === h.id ? ' selected' : '') + '>' + esc(x.name) + (x.extinct ? ' (line ended)' : '') + '</option>').join('');
  const b = (op, label, dis) => '<button type="button" class="btn small" data-act="edit" data-op="' + op + '"' + (dis ? ' disabled' : '') + '>' + label + '</button>';
  const hd = head(h), fem = h.members.some(m => m.sex === 'f');
  return '<section class="stack-sm"><h3>Change a household</h3><label for="t-house">Household</label><select id="t-house" data-act-change="t-house">' + opts + '</select>' +
    (h.extinct ? '<p class="muted">This family line has ended.</p>' :
    '<p class="muted">' + landOf(h) + ' plots (men ' + menLand(h) + ', women ' + womenLand(h) + ') · ' + h.bars + ' iron bars · head ' + (hd ? esc(hd.name) + (hd.citizen ? ', citizen' : ', inferior') : 'none') + '</p>' +
    '<div class="row"><span class="label">Iron bars</span>' + b('bars-5','−5') + b('bars-1','−1') + b('bars+1','+1') + b('bars+5','+5') + '</div>' +
    '<div class="row"><span class="label">Men\'s land</span>' + b('his-1','−1', menLand(h) < 1) + b('his+1','+1') + '<span class="label">Women\'s land</span>' + b('her-1','−1', womenLand(h) < 1) + b('her+1','+1', !fem) + '</div>' +
    '<div class="row"><span class="label">Children</span>' + b('son','Add a son') + b('daughter','Add a daughter') + b('remove-child','Remove youngest child', !kids(h).length) + '</div>' +
    '<div class="row">' + b('head-citizen', hd && hd.citizen ? 'Make the head an inferior' : 'Restore the head\'s citizenship', !hd) + b('restore-all','Restore all citizenship') + b('skip', h.skipNext ? 'Cancel missed turn' : 'Miss next turn') + '</div>' +
    '<div class="row">' + (isPlayer(h) ? b('to-game','Hand this household to the game') : b('to-student','Give this household to a student')) + '</div>') +
  '</section>';
}
function viewTeacher(){
  const h = houseById(ui.tHouse), theme = readTheme() || 'system';
  const tb = (v, l) => '<button type="button" class="btn small" data-act="theme" data-value="' + v + '" aria-pressed="' + (theme === v) + '">' + l + '</button>';
  return '<div class="dialog drawer" role="dialog" aria-modal="true" aria-labelledby="t-title" tabindex="-1">' +
    '<div class="row between"><h2 id="t-title">Teacher</h2><button type="button" class="btn small quiet" data-act="close" data-autofocus>Close <kbd>Esc</kbd></button></div>' +
    '<section class="stack-sm"><h3>Game</h3><div class="row">' +
      (state.phase === 'play' ? '<button type="button" class="btn small" data-act="undo"' + (undoStack.length ? '' : ' disabled') + '>Undo last action</button><button type="button" class="btn small" data-act="discuss">Pause for discussion</button>' : '') +
      '<button type="button" class="btn small" data-act="notes">' + (ui.notes ? 'Hide' : 'Show') + ' historian\'s notes</button>' +
      '<button type="button" class="btn small" data-act="fullscreen">Full screen</button></div>' +
      '<div class="row"><span class="label">Room</span>' + tb('light','Bright room') + tb('dark','Dimmed room') + tb('system','Follow laptop') + '</div></section>' +
    (state.phase === 'play' && h ? houseEditor(h) : '') +
    (state.phase === 'play' ? '<section class="stack-sm"><h3>Cards in the deck</h3><p class="muted">Untick a card to take it out of the deck.</p>' + cardList() + '</section>' : '') +
    '<section class="stack-sm"><h3>End or restart</h3><div class="row">' + (state.phase === 'play' ? '<button type="button" class="btn small" data-act="end-game">End the game and go to the debrief</button>' : '') + '<button type="button" class="btn small" data-act="restart">Restart (deletes the saved game)</button></div></section>' +
  '</div>';
}
function viewDiscuss(){
  const q = state.cur ? CARD[state.cur.num].q
    : state.step === 'mess' ? 'Why would Sparta make citizenship depend on paying mess dues?'
    : state.step === 'census' ? 'What does the census show? Who is gaining land, and who is losing citizenship?'
    : 'What has changed in our Sparta this round, and why?';
  return '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="d-title" tabindex="-1">' +
    '<div class="row between"><p class="eyebrow" id="d-title">Pause for discussion</p><button type="button" class="btn small quiet" data-act="close" data-autofocus>Back to the game <kbd>Esc</kbd></button></div>' +
    '<p class="discuss-q">' + esc(q) + '</p>' +
    '<div class="row"><span class="label">Timer</span>' + [1,2,3].map(m => '<button type="button" class="btn small" data-act="timer" data-min="' + m + '">' + m + ' min</button>').join('') + (ui.timerEnd ? '<button type="button" class="btn small quiet" data-act="timer-stop">Stop</button>' : '') + '</div>' +
    '<p class="timer" id="timer" aria-live="off">' + fmtTimer() + '</p></div>';
}
function roleLabel(m){
  if (m.role === 'head') return 'Head of household';
  if (m.role === 'wife') return m.heiress ? 'Wife (heiress)' : 'Wife';
  if (m.role === 'widow') return 'Widow';
  if (m.role === 'kin') return 'Brother\'s widow';
  return m.role === 'son' ? 'Son' : 'Daughter';
}
function statusLabel(m){
  if (m.sex === 'm') return !isAdult(m) ? 'Boy (in the agoge)' : m.citizen ? 'Full citizen' : 'Inferior';
  return isAdult(m) ? '' : 'Girl';
}
function viewHouse(){
  const h = houseById(ui.overlay.id);
  if (!h) return '';
  return '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="h-title" tabindex="-1">' +
    '<div class="row between"><h2 id="h-title">' + esc(h.name) + '</h2><button type="button" class="btn small quiet" data-act="close" data-autofocus>Close <kbd>Esc</kbd></button></div>' +
    (h.extinct ? '<p>This family line has ended.</p>' :
      '<p>' + landOf(h) + ' plots · ' + h.bars + ' iron bars · ' + (isPlayer(h) ? 'run by ' + (h.students > 1 ? h.students + ' students' : 'a student') : 'run by the game') + '</p>' +
      '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th class="num">Land</th></tr></thead><tbody>' +
      h.members.slice().sort((a, b) => (a.role === 'head' ? -1 : b.role === 'head' ? 1 : byAge(a, b))).map(m => '<tr><td>' + esc(m.name) + '</td><td>' + roleLabel(m) + '</td><td>' + statusLabel(m) + '</td><td class="num">' + m.land + '</td></tr>').join('') +
      '</tbody></table></div>') +
    (h.honours.length ? '<h3>Honours</h3><ul class="plain-list">' + h.honours.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') +
  '</div>';
}
function viewConfirm(){
  const w = ui.overlay.what;
  const msg = w === 'new' ? 'Start a new game? This replaces the saved game on this laptop.' : 'Restart? This deletes the saved game on this laptop.';
  return '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="c-title" tabindex="-1" style="max-width:34rem">' +
    '<h2 id="c-title">' + (w === 'new' ? 'Start a new game?' : 'Restart the game?') + '</h2><p>' + msg + '</p>' +
    '<div class="row"><button type="button" class="btn primary" data-act="confirm-yes">' + (w === 'new' ? 'Start a new game' : 'Restart') + '</button><button type="button" class="btn quiet" data-act="close" data-autofocus>Cancel</button></div></div>';
}
function viewOverlay(){
  const o = ui.overlay;
  if (!o) return '';
  const inner = o.type === 'help' ? viewHelp() : o.type === 'teacher' ? viewTeacher() : o.type === 'discuss' ? viewDiscuss() : o.type === 'house' ? viewHouse() : o.type === 'confirm' ? viewConfirm() : '';
  return '<div class="overlay' + (o.type === 'teacher' ? ' drawer-wrap' : '') + '" data-bg="1">' + inner + '</div>';
}

/* ---------- timer, toast, copy ---------- */
let ticker = null, toastT = null;
function fmtTimer(){
  if (!ui.timerEnd) return '';
  const ms = Math.max(0, ui.timerEnd - Date.now());
  if (ms === 0) return 'Time\'s up';
  const s = Math.ceil(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function startTicker(){
  if (ticker || !HAS_DOM) return;
  ticker = setInterval(() => {
    const el = document.getElementById('timer');
    if (!ui.timerEnd || !ui.overlay || ui.overlay.type !== 'discuss' || !el){ clearInterval(ticker); ticker = null; return; }
    el.textContent = fmtTimer();
  }, 250);
}
function toast(msg){
  if (!HAS_DOM) return;
  const el = document.getElementById('toast');
  el.textContent = msg;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.textContent = ''; }, 2600);
}
function copyDebrief(){
  const text = debriefText();
  const fail = () => { ui.copyFallback = text; render(); const ta = document.getElementById('copy-fallback'); if (ta){ ta.focus(); ta.select(); } toast('Copying is blocked here. The text is selected below: press Cmd+C.'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Debrief copied. Paste it into a document.'), fail); }
  catch (e) { fail(); }
}

/* ---------- rendering and input ---------- */
function renderApp(){
  const app = document.getElementById('app');
  const ph = state.phase;
  app.innerHTML = ph === 'title' ? viewTitle() : ph === 'setup' ? viewSetup() : ph === 'children' ? viewChildren() : ph === 'play' ? viewPlay() : ph === 'debrief' ? viewDebrief() : '';
  document.getElementById('overlay-root').innerHTML = viewOverlay();
  ui.fresh = '';
  if (ui.overlay){
    const f = document.querySelector('#overlay-root [data-autofocus]') || document.querySelector('#overlay-root .dialog');
    if (f) f.focus({ preventScroll:true });
    if (ui.overlay.type === 'discuss' && ui.timerEnd) startTicker();
  } else {
    const p = document.querySelector('#app [data-primary]:not([disabled])');
    if (p) p.focus({ preventScroll:true });
  }
}
function wire(){
  document.addEventListener('click', e => {
    const bg = e.target.closest('[data-bg]');
    if (bg && e.target === bg){ closeOverlay(); return; }
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    act(b.dataset.act, Object.assign({}, b.dataset));
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.actChange) act(t.dataset.actChange, Object.assign({}, t.dataset, { value:t.value }));
    else if (t.dataset.field === 'students') act('students', { value:t.value });
  });
  document.addEventListener('input', e => {
    const t = e.target, f = t.dataset.field;
    if (f === 'house-name'){ const h = houseById(+t.dataset.id); if (h){ const hd = head(h); h.name = t.value.trim() || ('House of ' + (hd ? hd.name : '')); save(); } }
    else if (f === 'answer' && state.cur){ state.cur.answer = t.value; save(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ if (ui.overlay) closeOverlay(); return; }
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (ui.overlay) return;
    const k = e.key.toLowerCase();
    const click = sel => { const el = document.querySelector(sel); if (el && !el.disabled){ e.preventDefault(); el.click(); } };
    if (k === '?'){ e.preventDefault(); act('help'); return; }
    if (k === 'enter'){ if (tag !== 'BUTTON' && tag !== 'A' && tag !== 'SUMMARY') click('#app [data-primary]'); return; }
    if (k === 'n'){ click('#app [data-primary]'); return; }
    if (k === 'r'){ click('#app [data-roll]'); return; }
    if (state.phase !== 'play' && state.phase !== 'debrief') return;
    if (k === 't'){ act('teacher'); return; }
    if (state.phase !== 'play') return;
    if (k === 'u'){ act('undo'); return; }
    if (k === 'h'){ act('notes'); return; }
    if (k === 'd'){ act('discuss'); return; }
    if (/^[1-4]$/.test(k)){ const opts = document.querySelectorAll('#app .option'); const o = opts[+k - 1]; if (o && !o.disabled){ e.preventDefault(); o.click(); } }
  });
}
function start(data){
  saved = load();
  applyTheme(readTheme());
  state = data && data.state ? data.state : freshState();
  render = renderApp;
  render();
}

if (HAS_DOM){
  wire();
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ state }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
} else {
  globalThis.__kleros = { act, CARD, NOTES, freshState, turnHouse, messInfo, censusNow, head, wife, kids, sons, landOf, menLand, womenLand, citizenMen, active, isPlayer, drawCard,
    views:{ viewTitle, viewSetup, viewChildren, viewPlay, viewDebrief, viewOverlay, debriefText },
    ui, get state(){ return state; }, set state(v){ state = v; }, get undoDepth(){ return undoStack.length; } };
}
})();
</script>
